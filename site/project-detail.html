<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail - Deacon Care System</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div id="site-nav-container"></div>
    <div class="container">
        <script type="module">
            document.addEventListener('DOMContentLoaded', async () => {
                const navContainer = document.getElementById('site-nav-container');
                if (navContainer) {
                    const navResp = await fetch('site-nav.html');
                    if (navResp.ok) {
                        navContainer.innerHTML = await navResp.text();
                        const script = document.createElement('script');
                        script.src = 'site-nav.js';
                        document.body.appendChild(script);
                    }
                }
            });
        </script>
        <div class="header">
            <h1 id="projectTitle">Project Detail</h1>
        </div>

        <div id="loadingState"><p>Loading project…</p></div>

        <div id="projectContent" class="is-hidden content">

            <!-- Project summary -->
            <div class="section">
                <div class="household-section-header">
                    <h2>Project Info</h2>
                    <a href="#" id="editProjectBtn" class="icon-btn section-icon-link is-hidden" title="Edit Project">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                    </a>
                </div>
                <div id="projectInfo"></div>
            </div>

            <!-- Requirements — optional, collapsible. All fulfilled = ready to proceed. -->
            <details class="section" id="requirementsSection">
                <summary class="household-section-header" style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;">
                    <h2 style="margin:0;">Requirements <span id="reqSummaryBadge" style="font-size:0.75em;font-weight:400;color:var(--gh-text-muted);margin-left:6px;"></span></h2>
                    <button id="addRequirementBtn" class="btn" style="display:none;font-size:0.85em;">+ Add Requirement</button>
                </summary>
                <div id="allClearBanner" class="req-all-clear is-hidden">✓ All requirements fulfilled — project may proceed</div>
                <div id="requirementsList" style="margin-top:10px;"></div>
                <div id="addRequirementForm" class="is-hidden" style="margin-top:10px;display:grid;gap:6px;">
                    <div style="display:flex;gap:8px;">
                        <select id="reqType" class="summary-filter-select" style="flex:0 0 auto;">
                            <option value="material">Material</option>
                            <option value="plans">Plans</option>
                            <option value="funding">Funding</option>
                            <option value="labor">Labor</option>
                            <option value="permit">Permit</option>
                            <option value="other">Other</option>
                        </select>
                        <input type="text" id="reqDescription" placeholder="Description *" class="form-input" style="flex:1;">
                    </div>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="reqOwner" placeholder="Owner (person, team, or vendor)" class="form-input" style="flex:1;">
                    </div>
                    <textarea id="reqNotes" placeholder="Notes (optional)" rows="2" class="form-input"></textarea>
                    <div style="display:flex;gap:8px;">
                        <button id="saveRequirementBtn" class="btn">Add</button>
                        <button id="cancelRequirementBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>
            </details>

            <!-- Documents -->
            <div class="section" id="documentsSection">
                <div class="household-section-header">
                    <h2>Documents</h2>
                    <button id="addDocumentBtn" class="btn" style="display:none;">+ Add Document</button>
                </div>
                <div id="documentsList"></div>
                <div id="addDocumentForm" class="is-hidden" style="margin-top:10px;">
                    <input type="text" id="docLabel" placeholder="Label" class="form-input" style="margin-bottom:6px;width:100%;box-sizing:border-box;">
                    <input type="url" id="docUrl" placeholder="URL" class="form-input" style="margin-bottom:6px;width:100%;box-sizing:border-box;">
                    <select id="docType" class="summary-filter-select" style="margin-bottom:6px;">
                        <option value="document">Document</option>
                        <option value="plan">Plan</option>
                        <option value="photo">Photo</option>
                        <option value="link">Link</option>
                    </select>
                    <div style="display:flex;gap:8px;">
                        <button id="saveDocBtn" class="btn">Save</button>
                        <button id="cancelDocBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Discussion updates -->
            <div class="section">
                <div class="household-section-header">
                    <h2>Discussion</h2>
                </div>
                <div id="updatesList"></div>

                <div id="addUpdateForm" style="margin-top:12px;">
                    <select id="updateType" class="summary-filter-select" style="margin-bottom:6px;">
                        <option value="note">Note</option>
                        <option value="status">Status update</option>
                        <option value="blocker">Blocker</option>
                        <option value="resolved">Resolved</option>
                    </select>
                    <textarea id="updateText" placeholder="Add a note…" rows="3" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--gh-border);border-radius:4px;font-family:inherit;"></textarea>
                    <button id="submitUpdateBtn" class="btn" style="margin-top:6px;">Post Update</button>
                </div>
            </div>

        </div>

        <div id="errorState" class="is-hidden"><p class="error-message">Failed to load project.</p></div>
    </div>
    <script type="module" src="project-detail-page.js"></script>
</body>
</html>
