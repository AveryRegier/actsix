<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Deacon Care System</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="container">
        <!-- Reusable navigation bar -->
        <div id="site-nav-container"></div>
        <div class="header">
            <h1 class="page-title-with-icon">
                <span class="page-title-icon">👥</span>
                Members
            </h1>
            <p class="subtitle">View and manage church members. Click a name for details and family management.</p>
        </div>
        <table id="memberTable">
            <thead>
                <tr>
                    <th>Last Name &#x25B2;&#x25BC;</th>
                    <th>First Name &#x25B2;&#x25BC;</th>
                    <th>
                        Tags
                        <span class="tag-filter-container">
                            <select id="tagFilter" class="tag-filter">
                                <option value="">All Tags</option>
                            </select>
                        </span>
                    </th>
                </tr>
            </thead>
            <tbody id="memberTableBody"></tbody>
        </table>
        <a href="edit-member.html" class="btn add-member-btn">Add New Member</a>
    </div>
    <script src="redirect-handler.js"></script>
    <script type="module" src="members-page.js"></script>
</body>
</html>
